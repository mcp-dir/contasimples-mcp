# Smithery configuration for Conta Simples
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_contasimples

name: contasimples-mcp
displayName: "Conta Simples"
description: >
  Gestão financeira PJ no Conta Simples, extratos bancário e de cartão, cartões corporativos (listar/bloquear/desbloquear), categorias, usuários, papéis e convites. Gere suas credenciais em https://ib.contasimples.com/integracoes/api/credenciais

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/contasimples-mcp
repository: https://github.com/mcp-dir/contasimples-mcp

tags:
  - contasimples
  - brazil
  - fin
  - vertical
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_contasimples

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_contasimples/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
